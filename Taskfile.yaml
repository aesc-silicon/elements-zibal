version: '3'

env:
  OPENROAD_EXE: "/opt/elements/tools/OpenROAD/bin/openroad"
  YOSYS_EXE: "/opt/elements/tools/yosys/bin/yosys"
  KEPLER_FORMAL_EXE: "/opt/elements/tools/kepler-formal/bin/kepler-formal"
  PATH: "/usr/local/bin/:/opt/elements/tools/OpenROAD/bin/:/opt/elements/oss-cad-suite/bin/:{{ .PATH }}"

vars:
  CONTAINER_CHECK: "podman ps | grep {{.CONTAINER_NAME}} >/dev/null || venv/bin/podman-compose {{if .IS_HEADLESS}} -f podman-compose-headless.yml{{end}} up -d"
  CONTAINER_CMD: "podman exec \
    {{if .CONTAINER_ENV}}{{.CONTAINER_ENV}}{{end}} \
    -e OPENROAD_EXE={{ .OPENROAD_EXE }} \
    -e YOSYS_EXE={{ .YOSYS_EXE }} \
    -e KEPLER_FORMAL_EXE={{ .KEPLER_FORMAL_EXE }} \
    -e PATH={{ .PATH }} \
    --workdir={{ .PWD }} \
    {{if .CI}}-i{{else}}-it{{end}} {{.CONTAINER_NAME}} \
"
  RUN: "{{.CONTAINER_CMD}} bash -c"
  PDK_CHECK: "{{.RUN}} 'ciel enable --pdk-family {{.PDK_FAMILY}} --pdk-root {{.PWD}}/pdks/ {{.PDK_HASH}}'"

tasks:
  lib-sbt-publishLocal:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'cd {{.PWD}}/{{.project}} && sbt {{if .CI}}--warn{{end}} publishLocal'"

  west-init:
    desc: Initializes the west workspace using the local manifest.
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'west init -l {{.PWD}}/manifests'"

  west-update:
    desc: Fetches all west dependencies and exports the Zephyr CMake package.
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'west update'"
      - "{{.RUN}} 'pip install --break-system-packages -r modules/elements/zephyr/scripts/requirements.txt'"
      - "{{.RUN}} 'rm -rf ~/.cmake/packages/Zephyr'"
      - "{{.RUN}} 'rm -rf ~/.cmake/packages/ZephyrUnittest'"
      - "{{.RUN}} 'west zephyr-export'"

  lib-generate:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'BOARD={{ .FPGA | default .TARGET }} sbt {{if .CI}}--warn{{end}} \"runMain {{ .package }}.{{ .TARGET }}{{ if .FPGA }}.{{ .FPGA }}{{ end }}Generate\"'"

  lib-simulate:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'BOARD={{ .FPGA | default .TARGET }} sbt {{if .CI}}--warn{{end}} \"runMain {{ .package }}.{{ .TARGET }}{{ if .FPGA }}.{{ .FPGA }}{{ end }}Simulate {{ if .test_case }}{{ .test_case }}{{ else }}simulate{{ end }} {{ if .duration }}{{ .duration }}{{ else }}100{{ end }}\"'"

  lib-view-simulation:
    internal: true
    cmds:
      - "{{.RUN}} 'gtkwave -o {{ .BUILD_ROOT }}/{{ .SOC }}/{{ if .FPGA }}{{ .TARGET }}/fpga/{{ .FPGA }}{{ else }}{{ .TARGET }}{{ end }}/zibal/{{ .FPGA | default .TARGET }}Board/{{ if .test_case }}{{ .test_case }}{{ else }}simulate{{ end }}/wave.vcd'"

  lib-emulate:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'renode --console --disable-xwt -e \"set bin @{{.BUILD_ROOT}}/{{.SOC}}/firmware/image_container.img; include @hardware/scala/{{.package}}/{{.package}}_emul.resc; start\"'"

  lib-emulate-gui:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'renode --console -e \"set bin @{{.BUILD_ROOT}}/{{.SOC}}/firmware/image_container.img; include @hardware/scala/{{.package}}/{{.package}}_emul.resc; start\"'"

  lib-cosim-build:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'bash {{.ZIBAL_BASE}}/hardware/renode/cosim/build-cosim.sh {{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/zibal/{{.TOPCELL}}.v {{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/cosim {{.PWD}}/tools/renode-verilator-integration /opt/renode'"
      - "{{.RUN}} 'bash {{.ZIBAL_BASE}}/hardware/renode/cosim/check-cosim.sh hardware/scala/{{.package}}/{{.package}}_cosim.repl hardware/scala/{{.package}}/{{.package}}_cosim.resc {{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/cosim/peripherals.tsv {{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/cosim'"

  lib-cosim:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'renode --console --disable-xwt -e \"set bin @{{.BUILD_ROOT}}/{{.SOC}}/firmware/image_container.img; set cosimdir @{{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/cosim; include @hardware/scala/{{.package}}/{{.package}}_cosim.resc; start\"'"

  lib-cosim-gui:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'renode --console -e \"set bin @{{.BUILD_ROOT}}/{{.SOC}}/firmware/image_container.img; set cosimdir @{{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/cosim; include @hardware/scala/{{.package}}/{{.package}}_cosim.resc; start\"'"

  lib-synthesize-fpga:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'mkdir -p {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/fpga/{{ .FPGA }}/'"
      - "{{.RUN}} 'BOARD={{ .FPGA }} ./modules/elements/zibal/eda/{{ .vendor }}/fpga/syn.sh {{if .CI}}--quiet{{end}}'"

  lib-flash-bitstream:
    internal: true
    vars:
      mode: '{{ .mode | default "sram" }}'
      IMAGE_BASE: "{{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/fpga/{{ .FPGA }}/{{ .FPGA }}Top"
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'openFPGALoader -b {{ .OPENFPGALOADER_BOARD }}{{ if eq .mode \"spi\" }} -f {{ .IMAGE_BASE }}.bin{{ else }} {{ .IMAGE_BASE }}.bit{{ end }}'"

  lib-baremetal-firmware:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "if [ -d {{ .PWD }}/software/{{ .package }}/{{ .app }}/ ]; then {{.RUN}} 'BOARD={{ .FPGA | default .TARGET }} SOURCE={{ .PWD }}/software/{{ .package }}/{{ .app }}/ BUILD={{ .BUILD_ROOT }}/{{ .SOC }}/firmware/{{ .app }}/ SOC_HEADER={{ .BUILD_ROOT }}/{{ .SOC }}/firmware/{{ .app }}/ ARCH={{.arch}} make -C {{ .ZIBAL_BASE }}/software/baremetal'; fi"

  lib-zephyr-firmware:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'west build -p -b {{.boardname}} -d {{.BUILD_ROOT}}/{{.SOC}}/firmware/zephyr {{.app}}'"

  lib-sealring:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'klayout -n {{ .TECH }} -zz -r {{ .KLAYOUT_HOME }}/tech/scripts/sealring.py
                -rd width={{ .WIDTH }} -rd length={{ .LENGTH }}
                -rd output={{ .BUILD_ROOT}}/{{ .SOC }}/{{ .TARGET }}/zibal/macros/sealring/sealring.gds.gz'"
    vars:
      WIDTH:
        sh: head -n 1 {{ .BUILD_ROOT}}/{{ .SOC }}/{{ .TARGET }}/zibal/{{ .TOPCELL }}.sealring.txt
      LENGTH:
        sh: tail -n 1 {{ .BUILD_ROOT}}/{{ .SOC }}/{{ .TARGET }}/zibal/{{ .TOPCELL }}.sealring.txt

  lib-bondpad:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'klayout -n {{ .TECH }} -zz -r {{ .KLAYOUT_HOME }}/tech/scripts/bondpad.py
                -rd diameter=70.0 -rd shape=square
                -rd gds_output={{ .BUILD_ROOT}}/{{ .SOC }}/{{ .TARGET }}/zibal/macros/bondpad/bondpad_70x70.gds.gz
                -rd lef_output={{ .BUILD_ROOT}}/{{ .SOC }}/{{ .TARGET }}/zibal/macros/bondpad/bondpad_70x70.lef'"

  lib-layout:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.PDK_CHECK}}"
      - "{{.RUN}} 'source {{ .OPENROAD_FLOW_ROOT }}/../env.sh && make -C {{ .OPENROAD_FLOW_ROOT }} DESIGN_CONFIG={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/zibal/{{ if .macro}}{{ .macro}}/config.mk{{ else }}{{ .TOPCELL }}.mk{{ end }} WORK_HOME={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/ {{if .stage}}{{.stage}}{{end}}'"

  lib-generate-netlist:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'source {{ .OPENROAD_FLOW_ROOT }}/../env.sh && make -C {{ .OPENROAD_FLOW_ROOT }} DESIGN_CONFIG={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/zibal/{{ if .macro}}{{ .macro}}/config.mk{{ else }}{{ .TOPCELL }}.mk{{ end }} WORK_HOME={{ .BUILD_ROOT }}{{ .SOC }}/{{ .TARGET }}/orfs {{ .BUILD_ROOT }}{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}/base/6_final.cdl'"

  lib-update-metadata:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'source {{ .OPENROAD_FLOW_ROOT }}/../env.sh && make -C {{ .OPENROAD_FLOW_ROOT }} DESIGN_CONFIG={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/zibal/{{ if .macro}}{{ .macro}}/config.mk{{ else }}{{ .TOPCELL }}.mk{{ end }} WORK_HOME={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/ metadata-generate'"
      - "{{.RUN}} 'source {{ .OPENROAD_FLOW_ROOT }}/../env.sh && make -C {{ .OPENROAD_FLOW_ROOT }} DESIGN_CONFIG={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/zibal/{{ if .macro}}{{ .macro}}/config.mk{{ else }}{{ .TOPCELL }}.mk{{ end }} WORK_HOME={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/ update_rules'"

  lib-filler:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      # Don't use KLAYOUT_HOME with any PDK path
      - "{{.RUN}} 'KLAYOUT_HOME= gdsfill fill --process {{ .PDK }} {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}/base/6_final.gds'"

  lib-run-drc:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'python3 {{ .KLAYOUT_HOME }}/tech/drc/run_drc.py --path {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}/base/6_final.gds --topcell {{ .TOPCELL }} --run_dir {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/drc/ --no_recommended --mp={{numCPU}} {{ if .level }}--disable_extra_rules{{end}} {{ if .nofeol }}--no_feol{{end}} {{ if .precheck }}--no_angle --precheck_drc{{end}}'"

  lib-view-drc:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'klayout -n {{ .TECH }}
                -e {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}/base/6_final.gds
                -m {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/drc/6_final_{{ .TOPCELL }}_full.lyrdb'"

  lib-run-lvs:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'python3 {{ .KLAYOUT_HOME }}/tech/lvs/run_lvs.py --layout {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}/base/6_final.gds --netlist {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}/base/6_final.cdl --topcell {{ .TOPCELL }} --run_dir {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/lvs/'"

  lib-view-lvs:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'klayout -n {{ .TECH }}
                -e {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}/base/6_final.gds
                -mn {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/lvs/6_final.lvsdb'"


  lib-view-openroad:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} '{{ .OPENROAD_EXE }} -gui <(echo read_db {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}{{if .macro}}_{{ .macro }}{{end}}/base/{{if .stage }}{{ .stage }}{{else}}6_final{{end}}.odb)'"

  open-openroad:
    desc: Starts OpenROAD with no layout file loaded.
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} '{{ .OPENROAD_EXE }} -gui'"

  lib-view-klayout:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'klayout -n {{ .TECH }}
                -e {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/results/{{ .PDK }}/{{ .TOPCELL }}{{if .macro}}_{{ .macro }}{{end}}/base/6_final.gds'"

  open-klayout:
    desc: Starts KLayout with no layout file loaded.
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'klayout -n {{ .TECH }} -e'"

  lib-check-logs:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'find {{ .BUILD_ROOT  }}/{{ .SOC }}/{{ .TARGET }}/orfs/ -type f -iname \"*.log\" -exec grep -v -e \"already destroyed\" -e \"XDG_RUNTIME_DIR not set\" -i {} \\+ |
                grep --color -e WARNING -e ERROR'"
      - "{{.RUN}} 'find {{ .BUILD_ROOT  }}/{{ .SOC }}/{{ .TARGET }}/orfs/reports/ -type f -iname \"6_finish.rpt\" -exec grep  \"violation count\" {} \\+'"

  lib-check-metadata:
    internal: true
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'source {{ .OPENROAD_FLOW_ROOT }}/../env.sh && make -C {{ .OPENROAD_FLOW_ROOT }} DESIGN_CONFIG={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/zibal/{{ if .macro}}{{ .macro}}/config.mk{{ else }}{{ .TOPCELL }}.mk{{ end }} WORK_HOME={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/orfs/ metadata-check'"

  clean-zibal:
    desc: Cleans up Zibal-specific files and artifacts.
    cmds:
      - rm -rf {{ .BUILD_ROOT }}
  clean:
    desc: Removes temporary files and intermediate build outputs.
    cmds:
      - task: clean-zibal

# LibreLane internal tasks

  lib-librelane-build:
    internal: true
    # Hardens every design listed in build-order.txt (blocks first, then the
    # top) in one pass. The run dir is derived from each config's basename so a
    # block's final/ views land where the top's MACROS reference them.
    # Pass macro=<design> to harden only that single design (e.g. a macro).
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.PDK_CHECK}}"
      - "{{.RUN}} 'macro=\"{{.macro}}\"; while read -r cfg; do [ -z \"$cfg\" ] && continue; design=$(basename \"$cfg\" .yaml); [ -n \"$macro\" ] && [ \"$design\" != \"$macro\" ] && continue; rd={{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/librelane/$design; mkdir -p \"$rd\"; echo \"### LibreLane: $design ###\"; PYTHONPATH={{.PWD}}/tools/librelane python3 -m librelane --pdk {{.PDK}} --pdk-root {{.PDK_ROOT}} --force-run-dir \"$rd\" \"$cfg\" || exit 1; done < {{.BUILD_ROOT}}/{{.SOC}}/{{.TARGET}}/zibal/librelane/build-order.txt'"

  lib-librelane-openroad:
    internal: true
    # Opens the LibreLane final ODB in the OpenROAD GUI. Design defaults to the
    # top (TOPCELL); pass macro=<design> to open a hardened block instead.
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} '{{ .OPENROAD_EXE }} -gui <(echo read_db {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/librelane/{{ if .macro }}{{ .macro }}{{ else }}{{ .TOPCELL }}{{ end }}/final/odb/{{ if .macro }}{{ .macro }}{{ else }}{{ .TOPCELL }}{{ end }}.odb)'"

  lib-librelane-klayout:
    internal: true
    # Opens the LibreLane final GDS in KLayout. Design defaults to the top
    # (TOPCELL); pass macro=<design> to open a hardened block instead.
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'klayout -n {{ .TECH }}
                -e {{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/librelane/{{ if .macro }}{{ .macro }}{{ else }}{{ .TOPCELL }}{{ end }}/final/gds/{{ if .macro }}{{ .macro }}{{ else }}{{ .TOPCELL }}{{ end }}.gds'"

  lib-librelane-view-drc:
    internal: true
    # Opens the LibreLane final GDS in KLayout with the KLayout.DRC marker
    # database loaded (-m). The DRC step dir carries a run-dependent number, so
    # the newest drc.klayout.lyrdb is resolved at runtime. Design defaults to the
    # top (TOPCELL); pass macro=<design> for a hardened block.
    cmds:
      - "{{.CONTAINER_CHECK}}"
      - "{{.RUN}} 'design={{ if .macro }}{{ .macro }}{{ else }}{{ .TOPCELL }}{{ end }}; rd={{ .BUILD_ROOT }}/{{ .SOC }}/{{ .TARGET }}/librelane/$design; drc=$(ls -t $rd/*-klayout-drc/reports/drc.klayout.lyrdb 2>/dev/null | head -1); if [ -z \"$drc\" ]; then echo \"No KLayout DRC report found for $design under $rd. Run the LibreLane build first.\"; exit 1; fi; klayout -n {{ .TECH }} -e $rd/final/gds/$design.gds -m \"$drc\"'"
