# Shared OpenOCD setup for any VexiiRiscv-based platform: the JTAG adapter and
# the VexiiRiscv RISC-V debug transport module (DTM). The TAP id and IR length
# are properties of the CPU, so they are identical across platforms. Platform
# files (hydrogen.cfg, carbon.cfg, ...) source this and then add their own
# memory map (work area + flash bank). Actions (init / reset / flash) are left
# to the caller's -c commands so this stays usable for both debug and flashing.

adapter driver ftdi
adapter usb product_name "Digilent USB Device"
adapter usb vid_pid 0x0403 0x6014
ftdi channel 0

ftdi layout_init 0x2088 0x308b
ftdi layout_signal nSRST -data 0x2000 -noe 0x1000

# REQUIRED for the VexiiRiscv SpinalHDL DTM: sample TDO on the FALLING edge of
# TCK. (A J-Link, which cannot do this, reads DTMCS back as 0x7ff.)
ftdi tdo_sample_edge falling

transport select jtag
reset_config none
adapter speed 6000

if { ![info exists _CHIPNAME] } {
	set _CHIPNAME vexiiriscv
}
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10002fff
target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu

riscv set_command_timeout_sec 10

proc program_spiflash {img} {
	init
	reset halt
	echo "nafarr_spi_xip: writing $img"
	flash write_image erase $img $::FLASH_BASE
	reset halt
	echo "nafarr_spi_xip: verifying $img"
	flash verify_image $img $::FLASH_BASE
	echo "nafarr_spi_xip: verification successful"
	reset run
	shutdown
}
