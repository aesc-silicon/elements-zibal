# Hydrogen platform: VexiiRiscv DTM (shared) plus the Hydrogen-class memory map.
# Declarative only - the caller runs init/reset/flash via -c, so this works for
# both debugging (gdb) and flashing.

set _CHIPNAME hydrogen
source [file dirname [info script]]/vexiiriscv.cfg

# --- Hydrogen-class memory map ---
# Work area in OCRAM lets flash verify/program run their CRC/loader on the CPU
# instead of OpenOCD reading the XIP window byte-by-byte.
$_CHIPNAME.cpu configure -work-area-phys 0x80000000 -work-area-size 0x2000 -work-area-backup 0

# SPI XIP flash (nafarr SpiXipController).
#   FLASH_BASE   0xa0000000 = XIP read window (firmware links at 0xa0001000).
#   ctrl_address 0xf0025000 = peripheral base + cfgXipBus offset 0x25000 (the
#     command engine lives on cfgXipBus, not cfgSpiBus at 0xf0024000).
#   size 0x80000 (512 KB)   = firmware partition, within the XIP-mapped range.
# Last arg = XIP read-mode config word (mode/dummyCycles/evcr) written before
# every read. 0x007f0702 = mode 0x02 (0xE7 Quad I/O read), dummy 7, evcr 0x7f.
set FLASH_BASE 0xa0000000
flash bank spiflash nafarr_spi_xip $FLASH_BASE 0x80000 0 0 $_CHIPNAME.cpu 0xf0025000 0x007f0702
