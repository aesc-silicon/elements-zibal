# Single entry point for programming the external SPI NOR flash over JTAG.
# Reads the build environment (SOC, BUILD_ROOT) - both exported into the
# container - so the caller only needs:
#     openocd -f flash_spi_flash.cfg
# It selects the platform config (DTM + flash bank) by SOC and programs the
# firmware-agnostic image_container.img via the program_spiflash proc.

set _here [file dirname [info script]]

switch -- $env(SOC) {
	ElemRV-H { source $_here/hydrogen.cfg }
	ElemRV-C { source $_here/carbon.cfg }
	default  { error "no OpenOCD platform config for SOC '$env(SOC)'" }
}

program_spiflash "$env(BUILD_ROOT)/$env(SOC)/firmware/image_container.img"
